# Runs both test suites and the dependency audits on every push and pull request.
name: test
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: backend/.nvmrc, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev

  sidecar:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sidecar } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: sidecar/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt pip-audit
      - run: .venv/bin/python scripts/download_models.py
      - run: .venv/bin/python -m pytest -q tests
      - run: .venv/bin/pip-audit -r requirements.txt
